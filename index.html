function save(k){
 const v=k==='session'?(S.session?S.session.id:''):k==='coupon'?S.coupon:S[k];
 ls.set(KEYS[k],typeof v==='string'?v:JSON.stringify(v));
 if(!fsMode)return;
 if(k==='products'&&S.products)syncColl('products',S.products,true);
 else if(k==='orders')syncColl('orders',S.orders,false);
 else if(k==='users')syncColl('users',S.users||[],false);
 else if(k==='msgs')syncColl('messages',S.msgs,false);
 else if(k==='reviews')syncColl('reviews',Object.keys(S.reviews).map(id=>({id,list:S.reviews[id]})),false);
 else if(k==='settings')syncColl('settings',[Object.assign({id:'main'},S.settings)],false);
}
function syncColl(name,items,del){
 const cache=last[name]||(last[name]={});const batch=db.batch();let n=0;const ids={};
 items.forEach(it=>{const id=String(it.id);ids[id]=1;const s=stable(it);if(cache[id]!==s){cache[id]=s;batch.set(db.collection(name).doc(id),clean(it));n++}});
 if(del)Object.keys(cache).forEach(id=>{if(!ids[id]){delete cache[id];batch.delete(db.collection(name).doc(id));n++}});
 if(n)batch.commit().catch(e=>console.warn('sync',name,e));
}

 S.reviews=g('reviews',{});S.msgs=g('msgs',[]);S.searches=g('searches',[]);S.settings=Object.assign({},DEF_SETTINGS,g('settings',{}));S.coupon=ls.get(KEYS.coupon)||'';

 db.collection('reviews').onSnapshot(sn=>{const r={};const c=last.reviews={};sn.docs.forEach(d=>{const o=d.data();r[d.id]=o.list||[];c[d.id]=stable(o)});S.reviews=r;emit()},e=>console.warn(e));

async function boot(){
 loadLocal();
 const cfg=window.DINSTORE_FIREBASE||{};
 const placeholder=!cfg||Object.keys(cfg).length===0||Object.values(cfg).some(v=>String(v).indexOf('YOUR_')>=0);
 let offlineMsg=false;
 if(!placeholder&&window.firebase){
  try{
   firebase.initializeApp(cfg);db=firebase.firestore();
   const snap=await Promise.race([db.collection('products').limit(1).get(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),12000))]);
   fsMode=true;
   S.orders=[];S.users=[];S.msgs=[];S.reviews={};S.products=null;
   if(snap.empty){S.products=seedProducts();save('products');S.settings=Object.assign({},DEF_SETTINGS);save('settings')}
   startListeners();
   const t0=Date.now();while(!S.products&&Date.now()-t0<8000)await new Promise(r=>setTimeout(r,100));
   if(!S.products)throw new Error('no products');
  }catch(e){console.warn('Firestore unavailable, local mode',e);fsMode=false;db=null;loadLocal();offlineMsg=true}
 }
 if(!fsMode&&(!S.products||!S.products.length)){S.products=seedProducts();save('products')}
 const sid=ls.get(KEYS.session);
 if(sid){
  try{
   if(fsMode){const d=await db.collection('users').doc(sid).get();if(d.exists){S.session=d.data();S.users=[S.session];last.users={};last.users[sid]=stable(S.session)}}
   else S.session=(S.users||[]).find(u=>u.id===sid)||null;
  }catch(e){console.warn(e)}
 }
 watchOrders();
 ui.ready=true;
 render(true);
 if(offlineMsg)toast('Offline mode: database not reachable');
}

/* ================= business logic ================= */
const P=id=>(S.products||[]).find(p=>p.id===id);
function cartLines(){return S.cart.map((c,i)=>({i,p:P(c.id),qty:c.qty,opt:c.opt||''})).filter(l=>l.p)}
function calc(dist){
 const lines=cartLines();const sub=lines.reduce((a,l)=>a+l.p.price*l.qty,0);let disc=0,err='',c=null;
 if(S.coupon){c=COUPONS.find(x=>x.code===S.coupon);
  if(!c)err='Invalid coupon';
  else if(c.min&&sub<c.min)err='Minimum order ৳'+c.min+' required';
  else if(c.type==='pct')disc=Math.min(Math.round(sub*c.value/100),c.max||Infinity);
  else if(c.type==='flat')disc=c.value;}
 disc=Math.min(disc,sub);
 let ship=0;
 if(lines.length&&dist){ship=isNear(dist)?S.settings.nearFee:S.settings.farFee;if(sub-disc>=S.settings.freeShip||(c&&!err&&c.type==='ship'))ship=0}
 return {lines,sub,disc,ship,total:sub-disc+ship,err,coupon:c,count:lines.reduce((a,l)=>a+l.qty,0)};
}
function addCart(id,q,opt){
 const p=P(id);if(!p||p.stock<=0){toast('Out of stock');return false}
 if(p.opts&&p.opts.length&&!opt){toast('Please select an option');return false}
 const ex=S.cart.find(c=>c.id===id&&(c.opt||'')===(opt||''));
 const have=S.cart.filter(c=>c.id===id).reduce((a,c)=>a+c.qty,0);
 if(have+q>p.stock){toast('Only '+p.stock+' in stock');return false}
 if(ex)ex.qty+=q;else S.cart.push({id,qty:q,opt:opt||''});
 save('cart');emit(true);return true;
}
function toggleWish(id){const i=S.wish.indexOf(id);if(i>=0){S.wish.splice(i,1);toast('Removed from wishlist')}else{S.wish.push(id);toast('Added to wishlist')}save('wish');emit(true)}
function addSearch(q){q=q.trim();if(!q)return;S.searches=[q].concat(S.searches.filter(s=>s.toLowerCase()!==q.toLowerCase())).slice(0,6);save('searches')}
function trackRecent(id){S.recent=[id].concat(S.recent.filter(x=>x!==id)).slice(0,12);save('recent')}
async function findUser(login){
 if(fsMode){const sn=await db.collection('users').where('login','==',login).limit(1).get();return sn.empty?null:sn.docs[0].data()}
 return (S.users||[]).find(u=>u.login===login)||null;
}
function putUser(u){if(!S.users)S.users=[];const i=S.users.findIndex(x=>x.id===u.id);if(i>=0)S.users[i]=u;else S.users.push(u);save('users')}

 reorder(t){const o=S.orders.find(x=>x.id===t.dataset.id);if(!o)return;o.items.forEach(i=>{if(P(i.id))addCart(i.id,i.qty,i.opt)});toast('Items added to cart');go('/cart')},
 print(){window.print()},
 track(){const v=($('#tr_in').value||'').trim().toUpperCase();if(!v){toast('Enter an order ID');return}go('/order/'+v)},
 authMode(t){authMode=t.dataset.m;render(false)},
 async doLogin(t){
  const login=normLogin($('#la_login').value),pw=$('#la_pass').value;
  if(!login||!pw){toast('Wrong login or password');return}
  let u=null;try{u=await findUser(login)}catch(e){console.warn(e)}
  const h=await sha(pw);if(!u||u.pass!==h){toast('Wrong login or password');return}
  S.session=u;if(!S.users)S.users=[];if(!S.users.some(x=>x.id===u.id))S.users.push(u);save('session');watchOrders();
  toast('Welcome back, '+u.name);go(t.dataset.next||'/account');emit(true);
 },
 async doRegister(t){
  const name=$('#ra_name').value.trim(),login=normLogin($('#ra_login').value),pw=$('#ra_pass').value,pw2=$('#ra_pass2').value;
  if(!name){toast('Enter your full name');return}
  const isPhone=PHONE_RE.test(login);
  if(!isPhone&&!EMAIL_RE.test(login)){toast('Enter a valid mobile number or email');return}
  if(pw.length<6){toast('Password must be at least 6 characters');return}
  if(pw!==pw2){toast('Passwords do not match');return}
  let ex=null;try{ex=await findUser(login)}catch(e){console.warn(e)}
  if(ex){toast('This account already exists');return}
  const u={id:'u'+Date.now(),name,login,pass:await sha(pw),role:'user',phone:isPhone?login:'',address:'',district:'Dhaka',joined:Date.now()};
  putUser(u);S.session=u;save('session');watchOrders();toast('Account created');go(t.dataset.next||'/account');emit(true);
 },
 logout(){try{if(window.firebase&&firebase.apps&&firebase.apps.length&&firebase.auth)firebase.auth().signOut()}catch(e){}S.session=null;save('session');watchOrders();S.orders=fsMode?[]:S.orders;toast('Logged out');go('/');emit(true)},
 helpOpen(){helpSheet()},
 sendMsg(){
  const name=$('#hm_name').value.trim(),phone=$('#hm_phone').value.trim(),msg=$('#hm_msg').value.trim();
  if(!msg){toast('Please write a message');return}
  S.msgs.push({id:'m'+Date.now(),uid:S.session?S.session.id:'',name,phone,msg,t:Date.now()});save('msgs');closeSheet();toast('Message sent. We will contact you soon.');
 },
 editProfile(){const u=S.session;openSheet('<h3>Edit Profile</h3><label class="l">Name</label><input class="inp" id="ep_name" value="'+esc(u.name)+'"><label class="l">Mobile</label><input class="inp" id="ep_phone" value="'+esc(u.phone)+'"><label class="l">District</label><select class="inp" id="ep_dist">'+DISTRICTS.map(d=>'<option'+(u.district===d?' selected':'')+'>'+d+'</option>').join('')+'</select><label class="l">Default address</label><textarea class="inp" id="ep_addr" rows="2">'+esc(u.address)+'</textarea><button class="btn blk" data-a="saveProfile">Save</button>')},
 saveProfile(){
  const u=S.session,name=$('#ep_name').value.trim(),ph=$('#ep_phone').value;
  if(!name){toast('Enter your full name');return}
  if(ph.trim()&&!PHONE_RE.test(cleanPhone(ph))){toast('Enter a valid Bangladeshi mobile number');return}
  u.name=name;u.phone=ph.trim()?normPhone(ph):'';u.district=$('#ep_dist').value;u.address=$('#ep_addr').value.trim();putUser(u);closeSheet();toast('Profile updated');emit(true);
 },
 pwOpen(){openSheet('<h3>Change Password</h3><label class="l">Current password</label><input class="inp" id="pw_o" type="password"><label class="l">New password (min 6)</label><input class="inp" id="pw_n" type="password"><button class="btn blk" data-a="savePw">Save</button>')},
 async savePw(){
  const u=S.session,o=$('#pw_o').value,n=$('#pw_n').value;
  if((await sha(o))!==u.pass){toast('Current password is wrong');return}
  if(n.length<6){toast('Password must be at least 6 characters');return}
  u.pass=await sha(n);putUser(u);closeSheet();toast('Password changed');
 },
 doSearch(t){const q=(t.dataset.q||'').trim();hideSugg();$('#sq').blur();if(!q)return;addSearch(q);$('#sq').value=q;go('/list?q='+encodeURIComponent(q))},
 voice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Voice search is not supported in this browser');return}
  try{const r=new SR();r.lang='en-US';toast('Listening...');
   r.onresult=e=>{const tx=e.results[0][0].transcript;$('#sq').value=tx;A.doSearch({dataset:{q:tx}})};
   r.onerror=r.onnomatch=()=>toast('Could not hear you');r.start()}catch(e){toast('Could not hear you')}
 }
};
function run(t){const f=A[t.dataset.a];if(f)f(t)}
document.addEventListener('click',e=>{
 const ov=e.target.closest('.ov');if(ov&&e.target===ov){closeSheet();return}
 if(e.target.id==='popup'){closePopup();return}
 if(!e.target.closest('#hdr'))hideSugg();
 const t=e.target.closest('[data-a]');if(!t)return;
 if(t.tagName==='A'&&t.getAttribute('href')==='#')e.preventDefault();
 e.stopPropagation();
 if(t.classList.contains('btn')){
  if(t.classList.contains('loading')||t.disabled)return;
  t.classList.add('loading');
  setTimeout(()=>{t.classList.remove('loading');run(t)},350);
 }else run(t);
});
document.addEventListener('input',e=>{const d=e.target.dataset||{};if(d.ck)ck[d.ck]=e.target.value;if(d.pk)pv[d.pk]=e.target.value});
document.addEventListener('change',e=>{
 const t=e.target,k=t.dataset&&t.dataset.ck;
 if(k){ck[k]=t.value;if(k==='dist'||k==='method')render(false)}
 if(t.dataset&&t.dataset.chg==='sort')go(listUrl({sort:t.value}));
});
document.addEventListener('keydown',e=>{
 if(e.key!=='Enter')return;const t=e.target;
 if(t.tagName==='INPUT'&&t.closest('[data-form]')){const b=t.closest('[data-form]').querySelector('.btn[data-a]');if(b){e.preventDefault();b.click()}}
});
/* ripple */
document.addEventListener('pointerdown',e=>{
 if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const t=e.target.closest('.btn,.chip,.opt,.mi');if(!t)return;
 const r=t.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement('span');
 s.className='ripple';s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';
 if(getComputedStyle(t).position==='static')t.style.position='relative';
 t.style.overflow='hidden';t.appendChild(s);setTimeout(()=>s.remove(),600);
});
/* scroll reveal */
let io=null;
if('IntersectionObserver' in window)io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target)}}),{threshold:.05});
function observeAll(){
 let i=0;$$('#app .rv:not(.in):not([data-obs])').forEach(el=>{
  el.dataset.obs='1';el.style.transitionDelay=(i++%8)*0.05+'s';
  if(io)io.observe(el);else el.classList.add('in');
 });
}
new MutationObserver(observeAll).observe($('#app'),{childList:true,subtree:true});

/* ================= header, nav, search ================= */
$('#hdr').innerHTML='<div class="hrow"><a id="brand" href="#/"></a><button class="back hide" id="bk" data-a="back"><i class="fas fa-arrow-left"></i></button><div class="sbox"><i class="fas fa-search"></i><input id="sq" placeholder="Search in ShopNix" autocomplete="off"><i class="fas fa-microphone" data-a="voice"></i></div><button class="hic" data-a="go" data-to="/cart"><i class="fas fa-shopping-cart"></i><span class="badge" id="hb"></span></button><button class="hic" data-a="helpOpen"><i class="fas fa-comment-dots"></i></button></div><div class="sugg" id="sugg"></div>';
$('#bnav').innerHTML='<a data-k="h" data-a="go" data-to="/"><i class="fas fa-home"></i>Home</a><a data-k="e" data-a="go" data-to="/explore"><i class="fas fa-compass"></i>Explore</a><a data-k="c" data-a="go" data-to="/cart"><i class="fas fa-shopping-cart"></i>Cart<span class="badge" id="nb"></span></a><a data-k="a" data-a="go" data-to="/account"><i class="fas fa-user"></i>Account</a>';
function suggHTML(v){
 v=v.trim();
 if(!v){if(!S.searches.length)return '';return '<div class="sg-h">Recent searches</div>'+S.searches.slice(0,6).map(s=>'<div class="sg" data-a="doSearch" data-q="'+esc(s)+'"><i class="fas fa-history"></i>'+esc(s)+'</div>').join('')}
 const toks=v.toLowerCase().split(/\s+/);
 const ms=(S.products||[]).filter(p=>{const h=(p.name+' '+p.brand+' '+p.cat+' '+(p.sku||'')).toLowerCase();return toks.every(t=>h.indexOf(t)>=0)}).slice(0,6);
 return ms.map(p=>'<div class="sg" data-a="open" data-id="'+p.id+'"><i class="fas fa-search"></i><span>'+esc(p.name)+'<small>'+esc(p.brand)+'</small></span></div>').join('')+'<div class="sg" data-a="doSearch" data-q="'+esc(v)+'"><i class="fas fa-search"></i>Search "'+esc(v)+'"</div>';
}
function showSugg(){const h=suggHTML($('#sq').value);const s=$('#sugg');s.innerHTML=h;s.classList.toggle('show',!!h)}
function hideSugg(){const s=$('#sugg');if(s)s.classList.remove('show')}
$('#sq').addEventListener('focus',showSugg);
$('#sq').addEventListener('input',showSugg);
$('#sq').addEventListener('keydown',e=>{if(e.key==='Enter')A.doSearch({dataset:{q:e.target.value}})});

/* ================= timers ================= */
setInterval(()=>{const t=$('#hero-track');if(!t)return;heroI=(heroI+1)%heroList().length;t.style.transform='translateX(-'+heroI*100+'%)';$$('.hd i').forEach((d,i)=>d.classList.toggle('on',i===heroI))},3500);
setInterval(()=>{const c=$('#cd');if(c)c.innerHTML=cdHTML()},1000);

/* ================= start ================= */
subs.push(force=>{
 if(!ui.ready)return;
 const a=document.activeElement;
 if(!force&&a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$('#app').contains(a)){updateChrome();return}
 render(false);
});
window.addEventListener('hashchange',()=>render(true));
render(true);
boot().catch(e=>{console.error(e);if(!ui.ready){if(!S.products)S.products=seedProducts();ui.ready=true;render(true)}});
})();
</script>
